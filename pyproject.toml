[project]
name = "openplanner"
version = "0.1.0"
description = "Lightweight group-booking service with Webex Contact Center dispatch."
readme = "README.md"
license = "EUPL-1.2"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "httpx>=0.28",
    "babel>=2.16",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "slowapi>=0.1.9",
    "itsdangerous>=2.2",
    "pyjwt[crypto]>=2.10",
    "cryptography>=44",
    "tzdata>=2025.2",
    "markdown-it-py>=4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "import-linter>=2.1",
    "bandit>=1.8",
    "pip-audit>=2.7",
    "pip-licenses>=5.0",
    "mutmut>=3.8.0",
    "pytest-xdist>=3.8.0",
]

# An application, not a library: run from the source tree, never built as a wheel.
[tool.uv]
package = false

# --- ruff -------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]
extend-exclude = [".semgrep"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "ASYNC", "PT", "D"]

# Google-style docstrings: readable by pdoc, mkdocstrings and Sphinx (napoleon) alike.
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts", "tests"]

[tool.ruff.lint.per-file-ignores]
# assert is the pytest idiom; S101 only matters in production code.
# Test names are the documentation; fixtures and fakes still explain themselves where useful.
"tests/**" = ["S101", "S105", "S106", "D"]
"migrations/**" = ["N999", "D103"]

# --- mypy -------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "scripts"]

# python-docx is a documentation tool, added only by `make diagrams` (scripts/diagrams).
[[tool.mypy.overrides]]
module = ["docx", "docx.*"]
ignore_missing_imports = true

# --- pytest / coverage ------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --strict-config"
filterwarnings = [
    "error",
    # aiosqlite hands every error inside its connection thread to the awaiting code; the
    # thread itself only fails when it cannot post the result because the event loop of a
    # finished test is closed. Nobody awaits that result any more. Under pytest-xdist's load
    # the thread can outlive its test, and pytest then fails whichever test runs next.
    "ignore:Exception in thread .*\\(_connection_worker_thread\\):pytest.PytestUnhandledThreadExceptionWarning",
]

[tool.coverage.run]
source = ["app"]
branch = true
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

# --- import-linter ----------------------------------------------------------
[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: entry points > adapters > domain"
type = "layers"
layers = [
    "app.main",
    "app.api | app.admin | app.jobs | app.cli",
    "app.web",
    "app.adapters",
    "app.domain",
]
containers = []
exhaustive = false

[[tool.importlinter.contracts]]
name = "Entry points do not import each other"
type = "independence"
modules = ["app.api", "app.admin", "app.jobs", "app.cli"]

[[tool.importlinter.contracts]]
name = "i18n is self-contained (ADR 0004)"
type = "forbidden"
source_modules = ["app.i18n"]
forbidden_modules = [
    "app.main",
    "app.api",
    "app.admin",
    "app.jobs",
    "app.web",
    "app.adapters",
    "app.domain",
    "app.config",
    "fastapi",
    "starlette",
    "sqlalchemy",
    "jinja2",
]

[[tool.importlinter.contracts]]
name = "Domain is framework-free and adapter-free"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "app.adapters",
    "app.api",
    "app.admin",
    "app.jobs",
    "app.web",
    "app.i18n",
    "fastapi",
    "starlette",
    "sqlalchemy",
    "alembic",
    "httpx",
    "pydantic_settings",
    "structlog",
    "uvicorn",
]

# --- bandit -----------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", "migrations"]

# --- mutmut (on merge to main: mutation score >= 80% on app/domain) ------------
[tool.mutmut]
# The i18n core is pure logic too and is held to the same bar (ADR 0004).
source_paths = ["app/domain/", "app/i18n/"]
also_copy = ["app/", "alembic.ini", "migrations/"]
pytest_add_cli_args_test_selection = ["tests/domain/", "tests/i18n/"]
