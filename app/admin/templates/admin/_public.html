{#- Pages outside a session (logged out, login failed): a centred card. -#}
{% extends "admin/_shell.html" %}
{% block page %}
<div class="admin-public">
  <header class="admin-public__header">
    <span class="admin-brand"><span class="admin-brand__mark" aria-hidden="true">OP</span><span>{{ _("admin.title") }}</span></span>
    {% include "_language_switcher.html" %}
  </header>
  <main id="content" tabindex="-1" class="card admin-public__card">
    {% block content %}{% endblock %}
  </main>
</div>
{% endblock %}
