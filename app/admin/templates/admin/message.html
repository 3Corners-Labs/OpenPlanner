{% extends "admin/layout.html" %}
{% block title %}{{ title }} – {{ _("admin.title") }}{% endblock %}
{% block content %}
<div class="card card--message">
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  {% if back_link %}
  <p><a href="/admin/">{{ _("admin.back_to_dashboard") }}</a></p>
  {% endif %}
</div>
{% endblock %}
