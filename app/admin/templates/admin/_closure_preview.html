{#- What participants see on the group page about a closure (ADR 0024). -#}
<div class="alert alert--info">
  {% if preview.heading %}<p><strong>{{ preview.heading }}</strong></p>{% endif %}
  <p><strong>{{ preview.title }}</strong> – {{ preview.period }}</p>
  {% for paragraph in preview.paragraphs %}<p>{{ paragraph }}</p>{% endfor %}
</div>
