{%- elif name == "plus" %}<path d="M12 5v14M5 12h14"/>
{%- elif name == "check" %}<path d="M5 12l5 5 9-10"/>

{%- else %}<circle cx="12" cy="12" r="2"/>
{%- endif %}
</svg>
