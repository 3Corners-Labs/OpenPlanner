name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.0"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

jobs:
  python:
    name: lint, types, tests, migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked
      - name: ruff
        run: make lint
      - name: mypy --strict
        run: make type
      - name: import-linter
        run: make imports
      - name: pytest + coverage (domain >= 90%, total >= 75%)
        run: make test
      - name: alembic up/down on a fresh database
        run: make migrations
      - name: bandit
        run: make security

  duplication:
    name: copy-paste detection
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: jscpd
        run: make duplication

  dependencies:
    name: lockfile, audit, licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: uv lock --check
        run: make lock
      - run: uv sync --locked
      - name: pip-audit
        run: make audit
      - name: pip-licenses (runtime dependencies)
        run: make licenses
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit (e2e tooling)
        working-directory: e2e
        run: npm ci && npm audit --audit-level=moderate

  semgrep:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: semgrep/semgrep:1.182.1
    steps:
      - uses: actions/checkout@v4
      - name: repo rules self-test
        run: semgrep --test --config .semgrep/rules.yml .semgrep/rules.py
      - name: scan
        run: >-
          semgrep scan --error --metrics=off
          --config p/python --config p/owasp-top-ten --config p/secrets
          --config .semgrep/rules.yml app/

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0
          git --redact --verbose /repo

  container:
    name: image build, scan, SBOM, API fuzzing
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - name: build
        run: docker build -t openplanner:ci .
      - name: trivy (CVE)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: openplanner:ci
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: trivy (misconfiguration)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          exit-code: "1"
          severity: HIGH,CRITICAL
      - name: start read-only, non-root
        run: scripts/run-app-container.sh openplanner:ci
      - name: schemathesis
        uses: schemathesis/action@v2
        with:
          schema: http://127.0.0.1:8000/openapi.json
          args: --checks all
      - name: container logs
        if: always()
        run: docker logs app
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: openplanner:ci
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - name: grype
        uses: anchore/scan-action@v6
        with:
          sbom: sbom.cdx.json
          fail-build: true
          severity-cutoff: high
          only-fixed: true
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

  e2e:
    name: accessibility (Playwright, axe-core, Lighthouse)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: build and start the app with the development identity provider
        run: |
          docker build -t openplanner:e2e .
          # Keycloak with one test user per role (dev/keycloak/), for the admin role specs.
          network="$(scripts/run-keycloak-container.sh)"
          # Three browsers each book, move and cancel from one IP: raise the write limit.
          scripts/run-app-container.sh openplanner:e2e -e RATE_LIMIT_BOOKINGS=100/hour \
            --network "$network" \
            -e OIDC_DISCOVERY_URL=http://keycloak:8080/realms/openplanner/.well-known/openid-configuration \
            -e OIDC_CLIENT_SECRET=dev-only-openplanner-admin-secret
          docker exec app alembic upgrade head
          docker exec app python -m app.cli seed-demo
      - name: install browsers
        working-directory: e2e
        timeout-minutes: 10
        run: npm ci && npx playwright install --with-deps
      - name: keyboard flows, admin roles + axe (WCAG 2.2 AA, zero violations)
        working-directory: e2e
        run: npm test
      - name: Lighthouse accessibility >= 95
        working-directory: e2e
        run: npm run lighthouse
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: e2e/test-results/
