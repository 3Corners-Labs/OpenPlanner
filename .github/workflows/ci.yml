name: ci

# ADR 0058: two lanes. The fast lane runs everywhere; the full lane (`matrix`, `container`,
# `e2e`) runs in the merge queue, on `main`, and on a pull request labelled `ci:full`. On any
# other pull request those jobs end as skipped, which a required check accepts, and the queue
# runs them before anything reaches `main`.
on:
  pull_request:
    # `labeled`: adding `ci:full` starts the full lane without a new push.
    types: [opened, synchronize, reopened, labeled]
  # The merge queue builds main plus the queued pull requests before it merges them, so two
  # PRs that are green on their own (for example two Alembic heads) cannot both land.
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every pinned version carries a `# renovate:` line so Renovate updates it (ADR 0051);
# `make pins` fails on a version it cannot see.
env:
  # renovate: datasource=github-releases depName=astral-sh/uv
  UV_VERSION: "0.13.6"
  # renovate: datasource=python-version depName=python
  PYTHON_VERSION: "3.12"
  # renovate: datasource=node-version depName=node versioning=node
  NODE_VERSION: "24"
  # renovate: datasource=docker depName=ghcr.io/gitleaks/gitleaks
  GITLEAKS_VERSION: "v8.30.1"
  # renovate: datasource=docker depName=fsfe/reuse
  REUSE_VERSION: "6.2.0"
  # renovate: datasource=docker depName=publiccodeyml/libpubliccode
  PUBLICCODE_PARSER_VERSION: "v5.5.1"

jobs:
  python:
    name: lint, types, tests, migrations
    runs-on: ubuntu-24.04
    # Every test but the authorisation matrix sweeps, with the coverage gates (ADR 0058).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked
      - name: ruff
        run: make lint
      - name: shellcheck (host scripts, updater)
        run: make shellcheck
      - name: mypy --strict
        run: make type
      - name: import-linter
        run: make imports
      - name: pytest + coverage (domain >= 90%, total >= 75%)
        run: make test
      - name: alembic up/down on a fresh database
        run: make migrations
      - name: bandit
        run: make security

  # The role × admin route sweeps of the authorisation matrix (ADR 0014), the slowest tests:
  # each case starts an app. Full lane only (ADR 0058); the structural matrix tests run in
  # `python`, so a route without a permission still fails every pull request.
  matrix:
    name: authorisation matrix
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'ci:full')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked
      - name: pytest -m matrix
        run: make matrix

  duplication:
    name: copy-paste detection
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: jscpd
        run: make duplication

  dependencies:
    name: lockfile, audit, licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: uv lock --check
        run: make lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: every pinned version tracked by Renovate, renovate.json valid
        run: make pins
      - run: uv sync --locked
      - name: pip-audit
        run: make audit
      - name: pip-licenses (runtime dependencies)
        run: make licenses
      - name: npm audit (e2e tooling)
        working-directory: e2e
        run: npm ci && npm audit --audit-level=moderate
      - name: npm audit and build (widget, ADR 0035)
        working-directory: widget
        run: npm ci --ignore-scripts && npm audit --audit-level=moderate && npm run build

  semgrep:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: semgrep/semgrep:1.182.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: repo rules self-test
        run: semgrep --test --config .semgrep/rules.yml .semgrep/rules.py
      - name: scan
        run: >-
          semgrep scan --error --metrics=off
          --config p/python --config p/owasp-top-ten --config p/secrets
          --config .semgrep/rules.yml app/

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The full history of the checked-out commit; other branches are scanned in their own PRs.
      - name: gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo" "ghcr.io/gitleaks/gitleaks:$GITLEAKS_VERSION"
          git --redact --verbose --log-opts=HEAD /repo

  licence:
    name: licence and contributor agreement
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ADR 0054: every file carries licence and copyright information (REUSE.toml).
      - name: reuse lint
        run: docker run --rm -v "$PWD:/data" "fsfe/reuse:$REUSE_VERSION" lint
      # ADR 0054: publiccode.yml (Standaard voor Publieke Code) is valid for catalogues such as
      # developer.overheid.nl, checked by the standard's own parser. Offline, so the job does not
      # depend on other sites being up; the logo and other local paths are still checked.
      - name: publiccode.yml
        run: >-
          docker run --rm -v "$PWD:/data:ro" -w /data
          "publiccodeyml/libpubliccode:$PUBLICCODE_PARSER_VERSION"
          -no-network -path /data publiccode.yml
      # Outside contributors tick the CLA box (docs/cla.md). Whoever can write to this
      # repository is exempt: members (also with a private membership, which
      # author_association reports as CONTRIBUTOR) and collaborators. The permission and the
      # PR body are read from the API at run time, so re-running the job after ticking the box
      # is enough. If the permission cannot be read, the box is required (fail closed). Values
      # come from the environment, never interpolated into the script.
      - name: contributor licence agreement
        if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          permission=$(gh api "repos/$REPO/collaborators/$AUTHOR/permission" --jq .permission 2>/dev/null || echo none)
          case "$permission" in
            admin|maintain|write)
              echo "The author can write to this repository ($permission): no CLA needed."
              exit 0
              ;;
          esac
          echo "Author permission: $permission; the CLA box is required."
          body=$(gh api "repos/$REPO/pulls/$NUMBER" --jq '.body // ""')
          if ! printf '%s' "$body" | grep -qiE -- '- \[x\] I agree to the OpenPlanner Contributor Licence Agreement'; then
            echo "::error::Tick 'I agree to the OpenPlanner Contributor Licence Agreement' in the pull request description (docs/cla.md), then re-run this job."
            exit 1
          fi

  container:
    name: image build, scan, SBOM, API fuzzing
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'ci:full')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
      - name: build
        run: docker build -t openplanner:ci .
      - name: trivy (CVE)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: openplanner:ci
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: trivy (misconfiguration)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          exit-code: "1"
          severity: HIGH,CRITICAL
      # TLS proxy (ADR 0030): same lint and CVE gate as the app image, then a real ACME run
      # against Pebble (Let's Encrypt's test CA).
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: deploy/proxy/Dockerfile
      - name: build proxy
        run: docker build -t openplanner-proxy:ci deploy/proxy
      - name: trivy (CVE, proxy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: openplanner-proxy:ci
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: proxy check (certificate over ACME, redirect, body limit)
        run: scripts/check-proxy.sh
      - name: start read-only, non-root
        run: scripts/run-app-container.sh openplanner:ci
      # The widget API (ADR 0035) reads the database: give schemathesis a migrated, empty one.
      - name: migrate the database
        run: docker exec app alembic upgrade head
      - name: schemathesis
        uses: schemathesis/action@b0cacf86f25caaa79ac110cc2077afd70fdd67ff # v3.1.0
        with:
          schema: http://127.0.0.1:8000/openapi.json
          args: --checks all
          # renovate: datasource=pypi depName=schemathesis
          version: "4.32.7"
          # The coverage report goes to the step summary; a PR comment would need write access.
          coverage-pr-comment: false
      - name: container logs
        if: always()
        run: docker logs app
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: openplanner:ci
          format: cyclonedx-json
          output-file: sbom.cdx.json
      - name: grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: sbom.cdx.json
          fail-build: true
          severity-cutoff: high
          only-fixed: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json

  e2e:
    name: accessibility (Playwright, axe-core, Lighthouse)
    if: >-
      github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'ci:full')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Official image with browsers and their system packages preinstalled, so the job does not
      # depend on apt mirrors (`playwright install --with-deps` timed out on them). The tag must
      # match the @playwright/test version in e2e/package.json; Renovate updates both together.
      # renovate: datasource=docker depName=mcr.microsoft.com/playwright
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/e2e-stack
      - name: install e2e tooling
        timeout-minutes: 10
        run: |
          version="${PLAYWRIGHT_IMAGE#*:v}"
          grep -q "\"@playwright/test\": \"${version%-*}\"" e2e/package.json \
            || { echo "PLAYWRIGHT_IMAGE does not match @playwright/test in e2e/package.json" >&2; exit 1; }
          docker run --rm -v "$PWD/e2e:/e2e" -w /e2e "$PLAYWRIGHT_IMAGE" npm ci
      - name: keyboard flows, admin roles + axe (WCAG 2.2 AA, zero violations)
        run: >-
          docker run --rm --network host --ipc host -e CI=true
          -v "$PWD/e2e:/e2e" -w /e2e "$PLAYWRIGHT_IMAGE" npm test
      - name: Lighthouse accessibility >= 95
        run: >-
          docker run --rm --network host -e CI=true
          -v "$PWD/e2e:/e2e" -w /e2e "$PLAYWRIGHT_IMAGE"
          sh -c "node host/serve.mjs & npm run lighthouse"
      # ADR 0038: maintenance closes every citizen page, so its page is checked last, alone.
      - name: maintenance page + axe (switches maintenance on and off again)
        run: >-
          docker run --rm --network host --ipc host -e CI=true -e MAINTENANCE_E2E=1
          -v "$PWD/e2e:/e2e" -w /e2e "$PLAYWRIGHT_IMAGE"
          npx playwright test tests/maintenance.spec.ts --project=chromium
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces
          path: e2e/test-results/

  # ADR 0051: a deprecated runtime, action or input fails the build instead of leaving a warning
  # annotation that nobody reads. Runs after every other job, also when one of them failed.
  deprecations:
    name: no deprecation warnings
    needs: [python, matrix, duplication, dependencies, semgrep, gitleaks, container, e2e]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Job permissions replace the workflow's, so contents: read is repeated for the checkout.
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: deprecation annotations of this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-deprecations.sh
