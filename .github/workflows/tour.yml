name: tour

# ADR 0087 step 3: the recorded walkthrough of the real interface. Records e2e/tour/tour.spec.ts
# against the release's own code with the e2e stack (Keycloak, simulator, demo seeds), adds the
# captions (nl, en) and attaches tour.webm, tour.jpg, tour.nl.vtt, tour.en.vtt, tour.json and a
# still per main chapter (tour-<chapter>.jpg) to the release. The `site` job of main.yml puts the newest recording on openplanner.nl.
#
# Called by main.yml for every release tag; a dispatch records an existing release again (for
# the first time, or after the script changed). A tag pushed with GITHUB_TOKEN starts no
# workflow, so this runs as a called workflow, not on a release event.

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag vX.Y.Z to record and attach to.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag vX.Y.Z to record and attach to (it must exist).
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tour-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  record:
    name: record the walkthrough
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write   # the recording on the release
    env:
      # Same image and tag as the accessibility job of ci.yml; Renovate updates both.
      # renovate: datasource=docker depName=mcr.microsoft.com/playwright
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.64.1-noble
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - name: the release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$TAG" --json tagName >/dev/null
      - uses: ./.github/actions/e2e-stack
      - name: install e2e tooling
        timeout-minutes: 10
        run: docker run --rm -v "$PWD/e2e:/e2e" -w /e2e "$PLAYWRIGHT_IMAGE" npm ci
      - name: record
        run: >-
          docker run --rm --network host --ipc host -e CI=true
          -v "$PWD/e2e:/e2e" -w /e2e "$PLAYWRIGHT_IMAGE" npm run tour
      - name: captions
        run: >-
          docker run --rm -v "$PWD/e2e:/e2e" -w /e2e "$PLAYWRIGHT_IMAGE"
          node tour/captions.mjs "$TAG"
      - name: attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd e2e/tour-output
          gh release upload "$TAG" tour.webm tour.jpg tour.nl.vtt tour.en.vtt tour.json tour-*.jpg --clobber
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: tour-traces
          path: e2e/test-results/
