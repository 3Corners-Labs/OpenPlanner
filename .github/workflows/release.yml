name: release

# ADR 0079: a release is two clicks, not a laptop ritual. Both are a workflow_dispatch by the
# product owner, and the click is the recorded instruction of ADR 0012 and ADR 0052 point 3.
#
#   step = release-pr   the release PR `chore(release): vX.Y.Z` (branch, pyproject.toml, uv.lock,
#                       CHANGELOG.md, the PR template filled in, auto-merge). For a minor or
#                       major version (vX.Y.0) the `audit` job then runs the independent review
#                       of ADR 0078 and writes it into the PR body, ending with `Verdict: open`.
#                       The product owner reads it, changes the verdict to `pass` and sets the
#                       label `po:approved`; the merge queue does the rest.
#   step = tag          after the release PR merged: the checks of ADR 0052 point 4 and the
#                       annotated tag on the merge commit, pushed so that main.yml builds, signs
#                       and publishes the release.
#
# The file edits and checks live in `scripts/release_pr.py` (tested); the audit command in
# `scripts/release-audit.sh`; the tag gate in `scripts/check-release-audit.sh` (ADR 0078). This
# file only wires them to git and GitHub.
#
# Secrets and variables (docs/runbook.md, Releasing a version):
#   RELEASE_TOKEN   a token with contents and pull-requests write (fine-grained PAT or a GitHub
#                   App token). Needed because a PR or tag made with GITHUB_TOKEN starts no
#                   workflow: the release PR would get no CI and the tag no build.
#   OPENAI_API_KEY  for the audit (the Codex CLI through the action's proxy).
#   RELEASE_RUNNER  (variable, optional) the label of a self-hosted runner; default
#                   ubuntu-24.04. The audit job drops sudo irreversibly: give it a disposable
#                   (ephemeral) runner.

on:
  workflow_dispatch:
    inputs:
      step:
        description: "release-pr: open the release PR (and the audit for a minor or major version). tag: tag the merged release."
        type: choice
        options: [release-pr, tag]
        default: release-pr
      version:
        description: "X.Y.Z. For release-pr: empty means what scripts/release_plan.py gives. For tag: required."
        type: string
        default: ""
      dry_run:
        description: "Show what would happen: open no PR, run no audit, set no tag."
        type: boolean
        default: false

permissions:
  contents: read

# One release at a time: two dispatches never race for the same number or tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-pr:
    name: release PR
    if: inputs.step == 'release-pr'
    runs-on: ${{ vars.RELEASE_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    permissions:
      contents: write        # push the release branch
      pull-requests: write   # open the PR and enable auto-merge
    outputs:
      version: ${{ steps.plan.outputs.version }}
      previous: ${{ steps.plan.outputs.previous }}
      branch: ${{ steps.plan.outputs.branch }}
      audit: ${{ steps.plan.outputs.audit }}
      number: ${{ steps.open.outputs.number }}
    steps:
      # A real release starts from the default branch; a dry run may start from any branch
      # (that is how a change to this workflow is tried before it merges).
      - name: a release is dispatched on the default branch
        if: ${{ !inputs.dry_run && github.ref_name != github.event.repository.default_branch }}
        env:
          REF: ${{ github.ref_name }}
        run: |
          echo "::error::dispatch the release on ${{ github.event.repository.default_branch }}, not on $REF (or tick dry_run)"
          exit 1
      - name: a real run needs RELEASE_TOKEN
        if: ${{ !inputs.dry_run }}
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          [ -n "$TOKEN" ] && exit 0
          echo "::error::the secret RELEASE_TOKEN is missing; a PR opened with GITHUB_TOKEN gets no CI (docs/runbook.md, Releasing a version)"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the last release tag and the commits since then
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - id: plan
        name: the number, from the commits since the last release unless given
        env:
          VERSION: ${{ inputs.version }}
        run: python3 -m scripts.release_pr plan --version "$VERSION" | tee -a "$GITHUB_OUTPUT"
      - name: pyproject.toml, uv.lock, CHANGELOG.md and the PR body
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: python3 -m scripts.release_pr prepare --version "$VERSION" --body "$RUNNER_TEMP/body.md" --actor "$GITHUB_ACTOR"
      - name: what would change (step summary)
        env:
          TITLE: ${{ steps.plan.outputs.title }}
          BRANCH: ${{ steps.plan.outputs.branch }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo "## $TITLE (dry run: $DRY_RUN)"
            echo
            echo "Branch \`$BRANCH\`, audit needed: ${{ steps.plan.outputs.audit }}"
            echo
            echo '```diff'
            git --no-pager diff
            echo '```'
            echo
            echo "<details><summary>PR body</summary>"
            echo
            cat "$RUNNER_TEMP/body.md"
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: no second PR for the same release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          BRANCH: ${{ steps.plan.outputs.branch }}
        run: |
          open="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')"
          [ -z "$open" ] || { echo "::error::release PR #$open for $BRANCH is already open"; exit 1; }
      - id: open
        name: branch, commit, PR, auto-merge
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TITLE: ${{ steps.plan.outputs.title }}
          BRANCH: ${{ steps.plan.outputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -am "$TITLE"
          # --force: a branch left by an earlier failed run is replaced, never a PR (checked above).
          git push --force origin "$BRANCH"
          url="$(gh pr create --base "${{ github.event.repository.default_branch }}" --head "$BRANCH" \
            --title "$TITLE" --body-file "$RUNNER_TEMP/body.md")"
          number="$(gh pr view "$url" --json number --jq .number)"
          gh pr merge --auto --squash "$number"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "::notice::opened $url with auto-merge; it waits for CI, the audit (if any) and the label po:approved"

  # ADR 0078 point 4: a minor or major release carries an independent review of everything
  # since the last release by a second model. `openai/codex-action` installs the Codex CLI,
  # starts its key proxy (the key never reaches the review process) and drops sudo on the
  # runner; `scripts/release-audit.sh` then runs the same `codex review --base <last release>`
  # that `make release-audit` runs on a laptop. Read-only: the review changes nothing and only
  # the PR body is written afterwards, with the verdict left open for the product owner.
  # Cost: one review of the whole diff since the last release at high reasoning effort,
  # roughly 5 to 20 US dollars at today's GPT-5 prices (the v0.4.0 diff is about 45,000 lines).
  audit:
    name: release audit (second model, ADR 0078)
    needs: release-pr
    if: ${{ !inputs.dry_run && needs.release-pr.outputs.audit == 'true' }}
    runs-on: ${{ vars.RELEASE_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write   # the findings go into the release PR's body
    steps:
      # One Codex home for the action (it writes the proxy config there) and for the script.
      - name: CODEX_HOME for the action and the script
        run: echo "CODEX_HOME=$RUNNER_TEMP/codex-home" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-pr.outputs.branch }}
          fetch-depth: 0   # the review runs against the last release tag
          persist-credentials: false   # nothing on disk for the reviewed process to use
      - name: Codex CLI, key proxy, sudo dropped (no prompt; the review is the script's)
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1.13
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          safety-strategy: drop-sudo
      - name: codex review against the last release (scripts/release-audit.sh)
        env:
          PREVIOUS: ${{ needs.release-pr.outputs.previous }}
        run: scripts/release-audit.sh "$PREVIOUS" | tee "$RUNNER_TEMP/findings.md"
      - name: the findings into the PR body, verdict open
        if: ${{ always() && needs.release-pr.outputs.number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ needs.release-pr.outputs.number }}
          OUTCOME: ${{ job.status }}
        run: |
          if [ ! -s "$RUNNER_TEMP/findings.md" ]; then
            printf 'The audit job did not produce findings (job status: %s). See %s/%s/actions/runs/%s and re-run it.\n' \
              "$OUTCOME" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/findings.md"
          fi
          gh pr view "$NUMBER" --json body --jq .body > "$RUNNER_TEMP/body.md"
          python3 -m scripts.release_pr audit --body "$RUNNER_TEMP/body.md" --findings "$RUNNER_TEMP/findings.md"
          gh pr edit "$NUMBER" --body-file "$RUNNER_TEMP/body.md"
          echo "::notice::audit written to PR #$NUMBER; the product owner changes 'Verdict: open' to 'Verdict: pass' after reading it"

  # ADR 0052 points 3 and 4: the annotated tag on the merged release commit, on the product
  # owner's instruction (this dispatch), after the checks. main.yml checks the tag again before
  # it builds anything.
  tag:
    name: tag the merged release
    if: inputs.step == 'tag'
    runs-on: ${{ vars.RELEASE_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    permissions:
      contents: write        # the tag
      pull-requests: read    # scripts/check-release-audit.sh reads the release PR
    steps:
      - name: the version is given
        if: inputs.version == ''
        run: |
          echo "::error::the tag step needs the version (X.Y.Z) of the merged release PR"
          exit 1
      - name: a release is dispatched on the default branch
        if: ${{ !inputs.dry_run && github.ref_name != github.event.repository.default_branch }}
        env:
          REF: ${{ github.ref_name }}
        run: |
          echo "::error::dispatch the tag on ${{ github.event.repository.default_branch }}, not on $REF (or tick dry_run)"
          exit 1
      - name: a real run needs RELEASE_TOKEN
        if: ${{ !inputs.dry_run }}
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          [ -n "$TOKEN" ] && exit 0
          echo "::error::the secret RELEASE_TOKEN is missing; a tag pushed with GITHUB_TOKEN starts no build"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the release commit on main, and whether the tag exists
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - id: release
        name: the merged release PR on main, pyproject.toml agrees, no tag yet
        env:
          VERSION: ${{ inputs.version }}
        run: python3 -m scripts.release_pr tag-check --version "$VERSION" --actor "$GITHUB_ACTOR" | tee -a "$GITHUB_OUTPUT"
      - name: a minor or major release carries its audit with Verdict pass (ADR 0078)
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REF_NAME: v${{ inputs.version }}
          COMMIT: ${{ steps.release.outputs.commit }}
        run: |
          git checkout --quiet "$COMMIT"
          scripts/check-release-audit.sh
      - name: what would be tagged (step summary)
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ steps.release.outputs.commit }}
          MESSAGE: ${{ steps.release.outputs.message }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo "## v$VERSION on $COMMIT (dry run: $DRY_RUN)"
            echo
            echo "Release PR #${{ steps.release.outputs.number }}; tag message: $MESSAGE"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: annotated tag, pushed
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ steps.release.outputs.commit }}
          MESSAGE: ${{ steps.release.outputs.message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" "$COMMIT" -m "$MESSAGE"
          git push origin "refs/tags/v$VERSION"
          echo "::notice::v$VERSION tagged on $COMMIT; main.yml builds, signs and publishes it ($MESSAGE)"
