name: main

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=astral-sh/uv
  UV_VERSION: "0.13.6"
  # renovate: datasource=python-version depName=python
  PYTHON_VERSION: "3.12"
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  zap-baseline:
    name: OWASP ZAP baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t openplanner:zap .
      - name: start container with the demo group
        run: |
          scripts/run-app-container.sh openplanner:zap
          docker exec app alembic upgrade head
          docker exec app python -m app.cli seed-demo
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          # The booking page links to the form and the static assets; the spider follows them.
          target: http://127.0.0.1:8000/g/demo
          rules_file_name: .zap/rules.tsv
          fail_action: true
          allow_issue_writing: false

  mutation:
    name: mutation score >= 80% on app/domain and app/i18n
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked
      - run: make mutation

  publish:
    name: build, push and sign image
    needs: [zap-baseline, mutation]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write   # attach the SBOM to a release
      packages: write   # push to ghcr.io
      id-token: write   # keyless cosign signature via GitHub OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the release check below needs main's history
      # ADR 0052: a release tag must sit on main and match pyproject.toml, or nothing is pushed.
      - name: release tag matches main and pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not a commit on main"; exit 1; }
          project="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          [ "v$project" = "$GITHUB_REF_NAME" ] \
            || { echo "::error::tag $GITHUB_REF_NAME but pyproject.toml says $project"; exit 1; }
      # Registry paths must be lower case; the repository name is not.
      - id: image
        run: echo "name=${IMAGE,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
            type=ref,event=branch
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # ADR 0029: "1.4.0" on a v1.4.0 tag; "main" on a branch, which is no release.
          # ADR 0052: every image also knows the commit it was built from.
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            APP_COMMIT=${{ github.sha }}
          provenance: mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: sign image (keyless)
        run: cosign sign --yes "${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}"
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
      - name: attest SBOM
        run: >-
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json
          "${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}"
      - name: attach SBOM to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" sbom.cdx.json --verify-tag --generate-notes

  # ADR 0051: same gate as in ci.yml, for the jobs that run only on main.
  deprecations:
    name: no deprecation warnings
    needs: [zap-baseline, mutation, publish]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Job permissions replace the workflow's, so contents: read is repeated for the checkout.
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: deprecation annotations of this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-deprecations.sh
