name: main

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  UV_VERSION: "0.13.0"
  PYTHON_VERSION: "3.12"
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  zap-baseline:
    name: OWASP ZAP baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t openplanner:zap .
      - name: start container with the demo group
        run: |
          scripts/run-app-container.sh openplanner:zap
          docker exec app alembic upgrade head
          docker exec app python -m app.cli seed-demo
      - uses: zaproxy/action-baseline@v0.14.0
        with:
          # The booking page links to the form and the static assets; the spider follows them.
          target: http://127.0.0.1:8000/g/demo
          rules_file_name: .zap/rules.tsv
          fail_action: true
          allow_issue_writing: false

  mutation:
    name: mutation score >= 80% on app/domain and app/i18n
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked
      - run: make mutation

  publish:
    name: build, push and sign image
    needs: [zap-baseline, mutation]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write   # attach the SBOM to a release
      packages: write   # push to ghcr.io
      id-token: write   # keyless cosign signature via GitHub OIDC
    steps:
      - uses: actions/checkout@v4
      # Registry paths must be lower case; the repository name is not.
      - id: image
        run: echo "name=${IMAGE,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
            type=ref,event=branch
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # ADR 0029: "1.4.0" on a v1.4.0 tag; "main" on a branch, which is no release.
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          provenance: mode=max
      - uses: sigstore/cosign-installer@v3
      - name: sign image (keyless)
        run: cosign sign --yes "${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}"
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: false
      - name: attest SBOM
        run: >-
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json
          "${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}"
      - name: attach SBOM to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" sbom.cdx.json --verify-tag --generate-notes
