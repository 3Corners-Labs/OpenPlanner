name: main

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=astral-sh/uv
  UV_VERSION: "0.13.6"
  # renovate: datasource=python-version depName=python
  PYTHON_VERSION: "3.12"
  IMAGE: ghcr.io/${{ github.repository }}
  # ADR 0064 step 2: the TLS proxy (deploy/proxy) is released next to the application, so no
  # host builds Caddy itself. Same tags, same signature, own SBOM.
  PROXY_IMAGE: ghcr.io/${{ github.repository }}-proxy

jobs:
  zap-baseline:
    name: OWASP ZAP baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t openplanner:zap .
      - name: start container with the demo group
        run: |
          scripts/run-app-container.sh openplanner:zap
          docker exec app alembic upgrade head
          docker exec app python -m app.cli seed-demo
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          # The booking page links to the form and the static assets; the spider follows them.
          target: http://127.0.0.1:8000/g/demo
          rules_file_name: .zap/rules.tsv
          fail_action: true
          allow_issue_writing: false

  mutation:
    name: mutation score >= 80% on app/domain and app/i18n
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked
      - run: make mutation

  # ADR 0059: every merge to main becomes a release candidate X.Y.Z-rc.N, offered to
  # installations on the `rc` channel. It waits for the ZAP baseline only: the merge queue ran
  # the full lane on this commit (ADR 0058), and the mutation test above measures the tests,
  # not the image. One candidate at a time, so two merges never claim the same number.
  candidate:
    name: release candidate from main
    if: github.ref_type == 'branch'
    needs: [zap-baseline]
    concurrency:
      group: release-candidate
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30   # two images; the proxy build fetches Go modules
    permissions:
      contents: write   # the rc tag and its pre-release
      packages: write   # push to ghcr.io
      id-token: write   # keyless cosign signature via GitHub OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the candidate number needs the tags and main's history
      # Registry paths must be lower case; the repository name is not.
      - id: image
        run: |
          echo "name=${IMAGE,,}" >> "$GITHUB_OUTPUT"
          echo "proxy=${PROXY_IMAGE,,}" >> "$GITHUB_OUTPUT"
      - id: candidate
        name: next candidate number
        run: |
          version="$(python3 -m scripts.release_plan --candidate)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "::notice::release candidate $version"
      - id: publish
        uses: ./.github/actions/publish-image
        with:
          image: ${{ steps.image.outputs.name }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          # ADR 0029: the version an installation compares against; ADR 0052: the commit it
          # was built from.
          build-args: |
            APP_VERSION=${{ steps.candidate.outputs.version }}
            APP_COMMIT=${{ github.sha }}
          tags: |
            type=raw,value=${{ steps.candidate.outputs.version }}
            type=sha,format=long
            type=ref,event=branch
      - id: publish-proxy
        uses: ./.github/actions/publish-image
        with:
          image: ${{ steps.image.outputs.proxy }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          context: deploy/proxy
          sbom-file: sbom-proxy.cdx.json
          tags: |
            type=raw,value=${{ steps.candidate.outputs.version }}
            type=sha,format=long
            type=ref,event=branch
      # The tag comes after the images: a failed build leaves no tag and no pre-release. A tag
      # pushed with GITHUB_TOKEN starts no workflow, so this never triggers the release job.
      - name: tag and pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION: release candidate of main @ $GITHUB_SHA ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          git push origin "refs/tags/v$VERSION"
          gh release create "v$VERSION" sbom.cdx.json sbom-proxy.cdx.json --prerelease --verify-tag \
            --generate-notes --title "v$VERSION (release candidate)"

  publish:
    name: build, push and sign the release (application and proxy images)
    if: github.ref_type == 'tag'
    needs: [zap-baseline, mutation]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write   # attach the SBOM to a release
      packages: write   # push to ghcr.io
      id-token: write   # keyless cosign signature via GitHub OIDC
      pull-requests: read   # the release audit check reads the release PR (ADR 0078)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the release check below needs main's history
      # ADR 0052: a release tag must sit on main and match pyproject.toml, or nothing is pushed.
      # ADR 0059: release candidates are tagged by the candidate job, never by hand.
      - name: release tag matches main and pyproject.toml
        run: |
          case "$GITHUB_REF_NAME" in
            *-rc.*) echo "::error::$GITHUB_REF_NAME: release candidates are made by CI (ADR 0059)"; exit 1 ;;
          esac
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not a commit on main"; exit 1; }
          project="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          [ "v$project" = "$GITHUB_REF_NAME" ] \
            || { echo "::error::tag $GITHUB_REF_NAME but pyproject.toml says $project"; exit 1; }
      # ADR 0078: a minor or major release (vX.Y.0) carries an independent audit of everything
      # since the last release in its release PR; without it nothing is built or published.
      - name: a minor or major release carries its audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-release-audit.sh
      - id: image
        run: |
          echo "name=${IMAGE,,}" >> "$GITHUB_OUTPUT"
          echo "proxy=${PROXY_IMAGE,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - id: publish
        uses: ./.github/actions/publish-image
        with:
          image: ${{ steps.image.outputs.name }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          build-args: |
            APP_VERSION=${{ steps.image.outputs.version }}
            APP_COMMIT=${{ github.sha }}
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
      - id: publish-proxy
        uses: ./.github/actions/publish-image
        with:
          image: ${{ steps.image.outputs.proxy }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          context: deploy/proxy
          sbom-file: sbom-proxy.cdx.json
          tags: |
            type=sha,format=long
            type=semver,pattern={{version}}
      - name: attach the SBOMs to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" sbom.cdx.json sbom-proxy.cdx.json --verify-tag --generate-notes

  # ADR 0087 step 3: the recorded walkthrough, attached to every release.
  tour:
    name: recorded walkthrough
    if: github.ref_type == 'tag'
    needs: [publish]
    permissions:
      contents: write
    uses: ./.github/workflows/tour.yml
    with:
      tag: ${{ github.ref_name }}

  # ADR 0087: the public website, openplanner.nl. Built from site/ on every merge to main and
  # on every release tag, with the releases and the roadmap baked in; the tarball goes on the
  # release the tag made; the deploy is a git push to the web host's repository and runs only
  # where the environment `website` holds the remote and the key, so a fork or a pull request
  # never deploys.
  site:
    name: public website (build, attach, deploy)
    # On a merge to main it waits for `candidate`, so the release candidate that merge made is
    # on the page. On a tag it waits for `publish`, whose first step refuses a tag that is not
    # on main or that was made by hand (ADR 0052, ADR 0059): such a tag then deploys nothing.
    # On a tag it also waits for the recording, so the new walkthrough is on the page; a failed
    # recording does not hold the site back (the previous one stays).
    needs: [candidate, publish, tour]
    if: >-
      ${{ !cancelled() && (
        (github.ref_type == 'branch' && needs.candidate.result == 'success') ||
        (github.ref_type == 'tag' && needs.publish.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: website
    permissions:
      contents: write   # the site tarball on the release
      issues: read      # the roadmap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked
      # The newest hundred releases are mostly candidates; the latest stable release is asked
      # for on its own so it is on the page however many candidates came after it. The open
      # issues labelled adr:NNNN are the roadmap (ADR 0078).
      - name: the releases and the roadmap, for the page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/all.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > "$RUNNER_TEMP/latest.json" || echo '{}' > "$RUNNER_TEMP/latest.json"
          jq -s '.[0] + (if .[1].tag_name then [.[1]] else [] end)' "$RUNNER_TEMP/all.json" "$RUNNER_TEMP/latest.json" > "$RUNNER_TEMP/releases.json"
          gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" --paginate --slurp | jq 'add' > "$RUNNER_TEMP/issues.json"
      # The newest release that carries the recorded walkthrough (tour.yml).
      - name: the recorded walkthrough, for the page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(jq -r '[.[] | select(any(.assets[]; .name == "tour.webm"))][0].tag_name // empty' "$RUNNER_TEMP/releases.json")"
          if [ -n "$tag" ]; then
            gh release download "$tag" --dir site/static/media --pattern 'tour*'
          else
            echo "::notice::no release carries a recording yet; the page says it is coming"
          fi
      - name: build
        run: |
          uv run python -m scripts.build_site --out site/dist --releases "$RUNNER_TEMP/releases.json" \
            --issues "$RUNNER_TEMP/issues.json" --commit "$GITHUB_SHA"
          tar -C site/dist -czf "site-${GITHUB_REF_NAME#v}.tar.gz" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site-*.tar.gz
          retention-days: 14
      - name: attach the site to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" site-*.tar.gz --clobber
      - name: deploy to the web host (git push; skipped without the remote and the key)
        env:
          SITE_DEPLOY_REMOTE: ${{ vars.SITE_DEPLOY_REMOTE }}
          SITE_DEPLOY_KNOWN_HOSTS: ${{ vars.SITE_DEPLOY_KNOWN_HOSTS }}
          SITE_DEPLOY_DIR: ${{ vars.SITE_DEPLOY_DIR }}
          SITE_DEPLOY_BRANCH: ${{ vars.SITE_DEPLOY_BRANCH }}
          SITE_DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
        run: scripts/deploy-site.sh site/dist "${GITHUB_REF_NAME} ${GITHUB_SHA::12}"

  # ADR 0051: same gate as in ci.yml, for the jobs that run only on main.
  deprecations:
    name: no deprecation warnings
    needs: [zap-baseline, mutation, candidate, publish, tour, site]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Job permissions replace the workflow's, so contents: read is repeated for the checkout.
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: deprecation annotations of this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/check-deprecations.sh
