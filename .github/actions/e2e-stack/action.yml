name: e2e stack
description: >-
  Build the application image and start it with the development identity provider (Keycloak,
  one test user per role), the simulator standing in for Webex and the contact center, and the
  demo and journey seeds, on port 8000 as container "app". Shared by the accessibility job of
  ci.yml and the recorded walkthrough of tour.yml (ADR 0087 step 3), so both test the same
  stack. Writes e2e/fixtures.json.

runs:
  using: composite
  steps:
    - name: build and start the app with the development identity provider
      shell: bash
      run: |
        docker build -t openplanner:e2e .
        # Keycloak with one test user per role (dev/keycloak/), for the admin role specs.
        network="$(scripts/run-keycloak-container.sh)"
        # Three browsers each book, move and cancel from one IP: raise the write limit.
        # Every admin spec opens /admin/login from that same IP, about two a second with two
        # workers: the default 60 reads a minute refuses a login now and then, and the spec then
        # waits for a field that the refusal page does not have. 300 a minute is the ceiling
        # of the setting (ADR 0042 §7).
        # ORGANISATION_IDPS_ENABLED: tests/admin-org-idp.spec.ts registers realm `andere` as an
        # organisation's own identity provider (ADR 0083); until it does, logins are unchanged.
        # The journey spec (tests/video-journey.spec.ts) plays Webex and WxCC events with the
        # simulator (docs/runbook.md, section 10); the secrets sign them for the endpoints.
        scripts/run-app-container.sh openplanner:e2e -e RATE_LIMIT_BOOKINGS=100/hour \
          -e RATE_LIMIT_READS=300/minute \
          --network "$network" \
          -e OIDC_DISCOVERY_URL=http://keycloak:8080/realms/openplanner/.well-known/openid-configuration \
          -e OIDC_ISSUER=http://127.0.0.1:8080/realms/openplanner \
          -e ADMIN_MFA_REQUIRED=false \
          -e OIDC_CLIENT_SECRET=dev-only-openplanner-admin-secret \
          -e ORGANISATION_IDPS_ENABLED=true \
          -e SIMULATOR_ENABLED=true \
          -e WEBEX_WEBHOOK_SECRET=dev-only-webex-webhook-secret \
          -e WXCC_WEBHOOK_SECRET=dev-only-wxcc-webhook-secret
        docker exec app alembic upgrade head
        docker exec app python -m app.cli seed-demo
        # Closure examples (ADR 0037); the booking on hold's link exists only in this output.
        docker exec app python -m app.cli seed-closures > e2e/fixtures.json
