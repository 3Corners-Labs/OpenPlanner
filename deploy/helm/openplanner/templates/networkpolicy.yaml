{{- if .Values.networkPolicy.enabled }}
{{- if empty .Values.networkPolicy.ingressNamespaceLabels }}
{{- fail "networkPolicy.ingressNamespaceLabels is required: the labels of the ingress controller's namespace (an empty selector admits every namespace)" }}
{{- end }}
{{- $egress := .Values.networkPolicy.egress }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "openplanner.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "openplanner.selector" . | nindent 6 }}
  policyTypes: [Ingress{{ if $egress.enabled }}, Egress{{ end }}]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.ingressNamespaceLabels | nindent 14 }}
      ports:
        - {port: 8000, protocol: TCP}
  {{- if $egress.enabled }}
  {{- if or (empty $egress.dns.namespaceLabels) (empty $egress.dns.podLabels) }}
  {{- fail "networkPolicy.egress.dns needs namespaceLabels and podLabels of the cluster DNS (an empty selector opens port 53 to every pod)" }}
  {{- end }}
  {{- if empty $egress.to }}
  {{- fail "networkPolicy.egress.to is required with egress.enabled: every outbound destination of docs/dataflow.md as {cidr, ports}" }}
  {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml $egress.dns.namespaceLabels | nindent 14 }}
          podSelector:
            matchLabels:
              {{- toYaml $egress.dns.podLabels | nindent 14 }}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
    {{- range $egress.to }}
    {{- if empty .ports }}
    {{- fail "every networkPolicy.egress.to entry needs ports (TCP), for example [443]" }}
    {{- end }}
    - to:
        - ipBlock:
            cidr: {{ required "every networkPolicy.egress.to entry needs a cidr, for example 203.0.113.0/24" .cidr | quote }}
      ports:
        {{- range .ports }}
        - {port: {{ . }}, protocol: TCP}
        {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
