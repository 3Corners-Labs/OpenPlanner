apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "openplanner.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "openplanner.selector" . | nindent 4 }}
  ports:
    - {name: http, port: {{ .Values.service.port }}, targetPort: http}
