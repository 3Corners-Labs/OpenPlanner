# Test overlay for scripts/check-proxy.sh (ADR 0030, ADR 0064): Let's Encrypt's test CA
# (Pebble) instead of the real one, on loopback ports and the gateway of a probe network (a
# visitor over IPv6), with the app in development mode; the second pass serves an own
# certificate from the same mounted directory. Never for production.
services:
  web:
    environment:
      ENVIRONMENT: dev
      FORWARDED_ALLOW_IPS: ${CHECK_FORWARDED_ALLOW_IPS:-}
    # `tls-check --host booking.test --port 8443` from web reaches the proxy on the edge network.
    extra_hosts:
      - "booking.test:172.31.240.2"
    ports: !override
      - "127.0.0.1:18000:8000"
    # The round trip of ADR 0086: `address-check --ca-file` trusts the test CA from this directory;
    # CHECK_FORWARDED_ALLOW_IPS lets the script name a wrong proxy address on purpose.
    volumes:
      - ${PEBBLE_CERTS:?set by scripts/check-proxy.sh}:/pebble:ro
  worker:
    environment:
      ENVIRONMENT: dev
  pebble:
    image: ghcr.io/letsencrypt/pebble:2.10.1
    profiles: [tls]
    environment:
      # Pebble cannot reach the test domain; it accepts every challenge instead.
      PEBBLE_VA_ALWAYS_VALID: "1"
    networks:
      edge:
        ipv4_address: 172.31.240.5
  proxy:
    environment:
      TLS_DOMAIN: booking.test
      ACME_EMAIL: ops@booking.test
      ACME_CA: https://pebble:14000/dir
      # Trust Pebble's own TLS certificate (Go reads SSL_CERT_FILE).
      SSL_CERT_FILE: /pebble/pebble.minica.pem
      # Second pass of check-proxy.sh: an own certificate from the mounted directory.
      TLS_CERT_FILE: ${PROXY_CERT_FILE:-}
      TLS_KEY_FILE: ${PROXY_KEY_FILE:-}
      # Third pass: Caddy's internal authority, and a route to an upstream that is not there
      # (ADR 0112), so a 502 on /idp/ proves the route without a Keycloak.
      TLS_INTERNAL: ${PROXY_INTERNAL:-}
      IDP_UPSTREAM: ${PROXY_IDP_UPSTREAM:-}
    volumes:
      - ${PEBBLE_CERTS:?set by scripts/check-proxy.sh}:/pebble:ro
    depends_on:
      pebble:
        condition: service_started
    ports: !override
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:18443:8443"
      # A visitor over IPv6 (ipv6_client_check): the gateway of the probe network the script
      # makes, an address on this machine only.
      - "[${PROBE6_ADDRESS:?set by scripts/check-proxy.sh}]:18444:8443"
