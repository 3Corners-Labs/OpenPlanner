# Same shape for development and production: web + worker sharing one SQLite volume.
# Production pins a signed release by digest in .env.update (OPENPLANNER_IMAGE) and passes
# `--env-file .env.update`; the host updater maintains that file (ADR 0029).
x-app: &app
  build: .
  image: ${OPENPLANNER_IMAGE:-openplanner:local}
  env_file:
    - path: .env
      required: false
  volumes:
    - data:/srv/data
  read_only: true
  tmpfs:
    - /tmp
  user: "10001:10001"
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  web:
    <<: *app
    # Only web runs migrations, so web and worker never race on the schema.
    command:
      - sh
      - -c
      - >-
        alembic upgrade head &&
        exec uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000
        --no-access-log --proxy-headers
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    <<: *app
    command: ["python", "-m", "app.jobs.worker"]
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.jobs.healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # Development only (`docker compose --profile dev up`): catches all outgoing mail.
  # Inbox at http://127.0.0.1:8025. Never part of the production shape.
  mailpit:
    image: axllent/mailpit:v1.32.0
    profiles: [dev]
    ports:
      - "127.0.0.1:8025:8025"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # Development only: OIDC provider standing in for PingFederate (ADR 0013).
  # Realm with one test user per role: see dev/keycloak/README.md.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    profiles: [dev]
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Browsers use 127.0.0.1:8080; the web container reaches Keycloak as keycloak:8080.
      KC_HOSTNAME: http://127.0.0.1:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./dev/keycloak/openplanner-realm.json:/opt/keycloak/data/import/openplanner-realm.json:ro
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  data:
