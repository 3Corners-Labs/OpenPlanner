# Same shape for development and production: web + worker sharing one SQLite volume.
# Production pins a signed release by digest in .env.update (OPENPLANNER_IMAGE, and with the
# HTTPS proxy OPENPLANNER_PROXY_IMAGE; ADR 0064) and passes `--env-file .env.update`; the host
# updater maintains that file (ADR 0029). Without the pins, `build:` makes local images.
# Container logs rotate (ADR 0040): at most 5 files of 20 MB per container, the oldest dropped
# first. json-file stays the driver because log agents read its files; other limits go in a
# docker-compose.override.yml or the Docker daemon's defaults.
x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "5"
    compress: "true"

x-app: &app
  build: .
  image: ${OPENPLANNER_IMAGE:-openplanner:local}
  env_file:
    - path: .env
      required: false
    # Bootstrap keys from `python -m app.cli init` (ADR 0042 §9).
    - path: secrets/secrets.env
      required: false
  volumes:
    - data:/srv/data
  read_only: true
  tmpfs:
    - /tmp
  user: "10001:10001"
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging: *logging

services:
  web:
    <<: *app
    # Only web runs migrations, so web and worker never race on the schema.
    command:
      - sh
      - -c
      - >-
        alembic upgrade head &&
        exec uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000
        --no-access-log --proxy-headers
        --forwarded-allow-ips "$${FORWARDED_ALLOW_IPS:-172.31.240.2}"
    # X-Forwarded-For is trusted only from the TLS proxy's fixed address (ADR 0030; edge network
    # below). Behind a proxy of your own, FORWARDED_ALLOW_IPS in .env replaces it.
    networks: [default, edge]
    volumes:
      - data:/srv/data
      # The own certificate managed in the portal (ADR 0070): its private key lives here and
      # nowhere else (never in the database); web writes, the proxy reads. Empty with ACME.
      - portal-certs:/srv/portal-certs
    environment:
      # ADR 0070: whether the bundled proxy runs (the installer's OPENPLANNER_TLS pin), so the
      # portal knows the certificate source is its to manage; and the volume with the own key.
      TLS_PROXY_BUNDLED: ${OPENPLANNER_TLS:-false}
      TLS_PORTAL_CERTIFICATE_DIR: /srv/portal-certs
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    <<: *app
    command: ["python", "-m", "app.jobs.worker"]
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.jobs.healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # Every installation with a public domain (`docker compose --profile tls up -d`, ADR 0030,
  # ADR 0064): HTTPS on 443 with a certificate from Let's Encrypt, renewed automatically; port 80
  # only redirects and answers ACME challenges. Needs TLS_DOMAIN and ACME_EMAIL in proxy.env and
  # the domain's DNS pointing at this host. An own certificate instead: TLS_CERT_FILE and
  # TLS_KEY_FILE in proxy.env, the files in ./certs (read-only below), or the pair the superuser
  # uploads in the portal (ADR 0070, the portal-certs volume).
  proxy:
    # Released and signed next to the application image (ADR 0064 step 2); a host never builds
    # Caddy. Development and scripts/check-proxy.sh build it from deploy/proxy.
    build: deploy/proxy
    image: ${OPENPLANNER_PROXY_IMAGE:-openplanner-proxy:local}
    profiles: [tls]
    # Own settings file (proxy.env.example), so the proxy never sees the app's secrets and gets its
    # settings whichever --env-file compose runs with (.env.update, ADR 0029). The image refuses
    # to start without TLS_DOMAIN and ACME_EMAIL.
    env_file:
      - path: proxy.env
        required: false
    volumes:
      # Certificates, keys and the ACME account: keep them, or every restart asks the CA again
      # and soon hits its rate limits.
      - proxy-data:/data
      # An own certificate and key (ADR 0064); empty with ACME.
      - ./certs:/certs:ro
      # The own certificate from the portal (ADR 0070); the entrypoint's watcher reloads on change.
      - portal-certs:/portal-certs:ro
    networks:
      edge:
        ipv4_address: 172.31.240.2
    ports:
      - "80:8080"
      - "443:8443"
    depends_on:
      web:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /config:uid=10001,gid=10001
      - /tmp
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *logging

  # Development only (`docker compose --profile dev up`): catches all outgoing mail.
  # Inbox at http://127.0.0.1:8025. Never part of the production shape.
  mailpit:
    image: axllent/mailpit:v1.32.0
    profiles: [dev]
    ports:
      - "127.0.0.1:8025:8025"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging: *logging

  # Development only: OIDC provider standing in for PingFederate (ADR 0013).
  # Realm with one test user per role: see dev/keycloak/README.md.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    profiles: [dev]
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Browsers use 127.0.0.1:8080; the web container reaches Keycloak as keycloak:8080.
      KC_HOSTNAME: http://127.0.0.1:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./dev/keycloak/openplanner-realm.json:/opt/keycloak/data/import/openplanner-realm.json:ro
      # Organisation provider of `andere` (ADR 0083): entitlements and email only.
      - ./dev/keycloak/andere-realm.json:/opt/keycloak/data/import/andere-realm.json:ro
    ports:
      - "127.0.0.1:8080:8080"
    logging: *logging

  # The bundled identity provider of a test or lab installation (ADR 0090,
  # `docker compose --profile idp up -d`): the same Keycloak as `dev`, with a realm rendered by
  # scripts/render-keycloak-realm.sh from deploy/keycloak/realm.template.json with generated
  # secrets (secrets/keycloak.env: the admin console password, the client secret and the first
  # password of `super`). Bound to the host's loopback: the admin console is reached on the host
  # only; making the login reachable from elsewhere is the proxy's work (ADR 0090 step 2).
  idp:
    image: quay.io/keycloak/keycloak:26.8.1
    profiles: [idp]
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    env_file:
      # KC_BOOTSTRAP_ADMIN_PASSWORD, KC_HOSTNAME and the values the realm was rendered with.
      - path: secrets/keycloak.env
        required: false
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      # Browsers use KC_HOSTNAME (secrets/keycloak.env); the web container reaches it as idp:8080.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./secrets/keycloak-realm.json:/opt/keycloak/data/import/openplanner-realm.json:ro
      # Staff accounts and their passwords live here (the DPIA input, docs/dataflow.md): back it
      # up with the database volume, never copy it off the host.
      - idp-data:/opt/keycloak/data/h2
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    logging: *logging

networks:
  # Between the TLS proxy and web. Fixed so web can trust exactly the proxy's address.
  edge:
    ipam:
      config:
        - subnet: 172.31.240.0/28
          # Dynamic addresses (web) come from the upper half, so the proxy's fixed one is free.
          ip_range: 172.31.240.8/29

volumes:
  data:
  proxy-data:
  portal-certs:
  idp-data:
