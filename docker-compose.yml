# Same shape for development and production: web + worker sharing one SQLite volume.
x-app: &app
  build: .
  image: openplanner:local
  env_file:
    - path: .env
      required: false
  volumes:
    - data:/srv/data
  read_only: true
  tmpfs:
    - /tmp
  user: "10001:10001"
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  web:
    <<: *app
    # Only web runs migrations, so web and worker never race on the schema.
    command:
      - sh
      - -c
      - >-
        alembic upgrade head &&
        exec uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000
        --no-access-log --proxy-headers
    environment:
      # Only the TLS proxy (ADR 0029) may set X-Forwarded-For; see the edge network below.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.31.240.2}
    networks: [default, edge]
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    <<: *app
    command: ["python", "-m", "app.jobs.worker"]
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.jobs.healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # Production with a public domain (`docker compose --profile tls up -d`, ADR 0029): HTTPS on
  # 443 with a certificate from Let's Encrypt, renewed automatically; port 80 only redirects and
  # answers ACME challenges. Needs TLS_DOMAIN and ACME_EMAIL in .env and the domain's DNS
  # pointing at this host.
  proxy:
    build: deploy/proxy
    image: openplanner-proxy:local
    profiles: [tls]
    environment:
      # The image refuses to start while either of these is empty.
      TLS_DOMAIN: ${TLS_DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    volumes:
      # Certificates, keys and the ACME account: keep them, or every restart asks the CA again
      # and soon hits its rate limits.
      - proxy-data:/data
    networks:
      edge:
        ipv4_address: 172.31.240.2
    ports:
      - "80:8080"
      - "443:8443"
    depends_on:
      web:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /config:uid=10001,gid=10001
      - /tmp
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Development only (`docker compose --profile dev up`): catches all outgoing mail.
  # Inbox at http://127.0.0.1:8025. Never part of the production shape.
  mailpit:
    image: axllent/mailpit:v1.32.0
    profiles: [dev]
    ports:
      - "127.0.0.1:8025:8025"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # Development only: OIDC provider standing in for PingFederate (ADR 0013).
  # Realm with one test user per role: see dev/keycloak/README.md.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    profiles: [dev]
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Browsers use 127.0.0.1:8080; the web container reaches Keycloak as keycloak:8080.
      KC_HOSTNAME: http://127.0.0.1:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./dev/keycloak/openplanner-realm.json:/opt/keycloak/data/import/openplanner-realm.json:ro
    ports:
      - "127.0.0.1:8080:8080"

networks:
  # Between the TLS proxy and web. Fixed so web can trust exactly the proxy's address.
  edge:
    ipam:
      config:
        - subnet: 172.31.240.0/28
          # Dynamic addresses (web) come from the upper half, so the proxy's fixed one is free.
          ip_range: 172.31.240.8/29

volumes:
  data:
  proxy-data:
